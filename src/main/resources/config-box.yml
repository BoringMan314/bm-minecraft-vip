# 自訂禮包。contents 由上到下就是由左至右的放入順序。
# 束口袋（BUNDLE）：內容放在口袋裡，用原版方式取出。取出後開始倒數。
# 界伏盒（SHULKER_BOX）：放在地上後開始倒數，打開後只能取出、不能放入。
# 時間到或內容取完，禮包消失。其他材質仍是右鍵依序取出，取出後開始倒數。
# time 寫法與 config-item.yml 相同。permanent 不會倒數，內容取完才消失。
# contents 必須是 config-item.yml 裡的裝備編號。

boxes:
  "0001":
    name: "永久-VIP禮包"
    appearance: SHULKER_BOX
    time: permanent
    contents:
      - "0001"
      - "0002"
      - "0003"
      - "0004"
      - "0005"
      - "0006"
      - "0007"
  "0002":
    name: "30天-VIP禮包"
    appearance: SHULKER_BOX
    time: 30d
    contents:
      - "0008"
      - "0009"
      - "0010"
      - "0011"
      - "0012"
      - "0013"
      - "0014"
  "0003":
    name: "試用-VIP禮包"
    appearance: SHULKER_BOX
    time: "2999/01/01"
    contents:
      - "0015"
      - "0016"
      - "0017"
      - "0018"
      - "0019"
      - "0020"
      - "0021"
