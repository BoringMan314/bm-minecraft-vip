# 自訂裝備。編號請加引號，例如 "0001"。
# base：插件移除後留下的物品材質。appearance：外觀材質，只套用物品模型。
# time：permanent（永久）、30d 或 30天（第一次挖方塊後開始倒數）、2026/10/10（第一次使用後開始，台北時間當天結束前有效）。
# durability：最大耐久，會寫進說明，並真的會消耗。
# function.type=face：不管挖到哪一面，都只挖那一面的一層。size 是邊長，必須是正奇數，3 代表 3×3×1，挖到的那格在正中心。
# 也可改寫 range 當半徑；1 同樣是 3×3×1。size 與 range 同時存在時採用 size。
# function.type=forward：挖到的那格是底邊正中，沿玩家面向往前鋪一層平面。width 是左右，depth 是往前，都必須是正奇數。
# 3 與 3 代表往前的 3×3，只有一層。
# function.type=none：沒有範圍破壞。穿上後開始倒數，用來做套裝。
# enchants：該工具原本就能附上的附魔。插件移除後名稱與外觀會回到本體，這些附魔會留下。
# 編號順序：永久、30天、試用。每一段都是工具在前、套裝在後。新手工具接在最後。

